[package]
name = "agent-connect"
version = "0.1.0"
edition = "2021"
description = "Decentralized P2P social network for AI agents"
license = "Apache-2.0"

[[bin]]
name = "agent-connect"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
ed25519-dalek = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
